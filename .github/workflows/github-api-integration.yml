name: GitHub-Powered IPTV Check

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check repository API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY" --jq '{full_name,default_branch,html_url}'
          gh api "repos/$GITHUB_REPOSITORY/commits?per_page=1" --jq '.[0] | {sha,message:.commit.message}'
      - name: Validate IPTV playlists
        run: |
          set -euo pipefail
          for f in playlist.m3u8 persian.m3u8; do
            test -s "$f" || { echo "Missing or empty $f"; exit 1; }
            grep -q '^#EXTM3U' "$f" || { echo "Invalid M3U header: $f"; exit 1; }
            echo "✓ $f validated"
          done
      - name: Integration status
        run: |
          mkdir -p integration-status
          printf '{"repository":"%s","status":"ok","run_id":"%s"}\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > integration-status/status.json
      - name: Upload status artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-powered-iptv-status
          path: integration-status/status.json
