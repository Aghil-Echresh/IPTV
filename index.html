<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080b12">
<title>IPTV Player | Aghil-Echresh</title>
<link rel="stylesheet" href="./static/css/pages.css">
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
</head>
<body>
<header>
  <div><h1>📺 IPTV Player</h1><p>پخش آنلاین شبکه‌های زنده</p></div>
  <div class="header-actions"><div class="stats" id="stats">در حال بارگذاری...</div><a class="github-link" href="https://github.com/Aghil-Echresh/IPTV" target="_blank" rel="noopener">GitHub ↗</a></div>
</header>
<main>
<section class="player"><video id="video" controls playsinline preload="metadata"></video><div class="now" id="now">یک شبکه را انتخاب کنید</div></section>
<section class="toolbar">
<input id="search" type="search" autocomplete="off" placeholder="🔎 جستجوی شبکه یا کشور...">
<select id="group"><option value="">همه دسته‌ها</option></select>
<button id="refresh" type="button">↻ تازه‌سازی</button>
</section>
<section id="source" class="source">⏳ آماده‌سازی فهرست شبکه‌ها...</section>
<section id="channels" class="grid" aria-live="polite"></section>
</main>
<footer>IPTV Player • GitHub Pages • Aghil-Echresh</footer>
<script src="./static/js/pages.js"></script>
</body>
</html>
